name: source-e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  public-source-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python source
        run: python -m compileall -q api src tests
      - name: Validate browser script syntax
        run: |
          python - <<'PY'
          import re, pathlib
          text = pathlib.Path('web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          assert scripts, 'inline browser script not found'
          pathlib.Path('/tmp/tei-app.js').write_text(scripts[-1], encoding='utf-8')
          print('inline script bytes:', len(scripts[-1].encode('utf-8')))
          PY
          node --check /tmp/tei-app.js
      - name: Install test dependency
        run: python -m pip install --quiet pytest
      - name: Test live public source integration
        run: python -m pytest -q tests/test_public_sources.py
      - name: Test three-company non-judicial source integration
        run: python -m pytest -q tests/test_multi_company_sources.py -vv
