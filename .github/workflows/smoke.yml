name: T.E.I. live smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile Python application
        run: |
          python3 -m py_compile api/index.py api/test.py src/*.py

      - name: Check browser JavaScript syntax
        run: |
          node --check app.js

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Test official MOEA company API with known case target
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://data.gcis.nat.gov.tw/od/data/api/5F64D864-61CB-4D0D-8AD9-492047CC1EA6"
          uniform = "96972256"
          params = urllib.parse.urlencode({
              "$format": "json",
              "$filter": f"Business_Accounting_NO eq {uniform}",
              "$skip": "0",
              "$top": "1",
          })
          req = urllib.request.Request(
              base + "?" + params,
              headers={"Accept": "application/json", "User-Agent": "T.E.I./smoke-test"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              payload = json.loads(r.read().decode("utf-8-sig", "replace"))
          assert isinstance(payload, list) and payload, payload
          row = payload[0]
          assert row.get("Business_Accounting_NO") == uniform, row
          assert row.get("Company_Name") == "東京威力科創股份有限公司", row
          print("MOEA company API: PASS", row.get("Company_Name"))
          PY

      - name: Test official MOEA directors API with known case target
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://data.gcis.nat.gov.tw/od/data/api/4E5F7653-1B91-4DDC-99D5-468530FAE396"
          uniform = "96972256"
          params = urllib.parse.urlencode({
              "$format": "json",
              "$filter": f"Business_Accounting_NO eq {uniform}",
              "$skip": "0",
              "$top": "20",
          })
          req = urllib.request.Request(
              base + "?" + params,
              headers={"Accept": "application/json", "User-Agent": "T.E.I./smoke-test"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              payload = json.loads(r.read().decode("utf-8-sig", "replace"))
          assert isinstance(payload, list) and len(payload) > 0, payload
          print("MOEA directors API: PASS", len(payload), "rows")
          PY

      - name: Test official Judicial Yuan search page
        run: |
          python3 - <<'PY'
          import urllib.parse
          import urllib.request

          q = urllib.parse.quote_plus("東京威力科創股份有限公司")
          url = f"https://judgment.judicial.gov.tw/FJUD/qryresult.aspx?kw={q}&judtype=JUDBOOK"
          req = urllib.request.Request(url, headers={"User-Agent": "T.E.I./smoke-test"})
          with urllib.request.urlopen(req, timeout=30) as r:
              body = r.read().decode("utf-8", "ignore")
              final = r.geturl()
              status = r.status
          assert status == 200, (status, final)
          assert "裁判書" in body, final
          print("Judicial Yuan search page: PASS", final)
          PY
