name: T.E.I. live smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python application
        run: |
          python3 -m py_compile api/index.py api/test.py src/*.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Test official MOEA company API
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://data.gcis.nat.gov.tw/od/data/api/5F64D864-61CB-4D0D-8AD9-492047CC1EA6"
          params = urllib.parse.urlencode({
              "$format": "json",
              "$filter": "Business_Accounting_NO eq 20828393",
              "$skip": "0",
              "$top": "1",
          })
          req = urllib.request.Request(
              base + "?" + params,
              headers={"Accept": "application/json", "User-Agent": "T.E.I./smoke-test"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              payload = json.loads(r.read().decode("utf-8-sig", "replace"))
          assert isinstance(payload, list) and payload, payload
          row = payload[0]
          assert row.get("Business_Accounting_NO") == "20828393", row
          assert row.get("Company_Name"), row
          print("MOEA company API: PASS", row.get("Company_Name"))

      - name: Test official MOEA directors API
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://data.gcis.nat.gov.tw/od/data/api/4E5F7653-1B91-4DDC-99D5-468530FAE396"
          params = urllib.parse.urlencode({
              "$format": "json",
              "$filter": "Business_Accounting_NO eq 20828393",
              "$skip": "0",
              "$top": "3",
          })
          req = urllib.request.Request(
              base + "?" + params,
              headers={"Accept": "application/json", "User-Agent": "T.E.I./smoke-test"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              payload = json.loads(r.read().decode("utf-8-sig", "replace"))
          assert isinstance(payload, list), payload
          print("MOEA directors API: PASS", len(payload), "rows")
          PY
