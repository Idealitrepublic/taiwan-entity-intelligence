name: Sync Taiwan public evidence

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SYNC_PUBLIC_EVIDENCE to run the source sync'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    if: ${{ inputs.confirmation == 'SYNC_PUBLIC_EVIDENCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync public evidence
        env:
          JUDICIAL_USER: ${{ secrets.JUDICIAL_USER }}
          JUDICIAL_PASSWORD: ${{ secrets.JUDICIAL_PASSWORD }}
        run: python3 scripts/sync_public_sources.py

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-entity-evidence-${{ github.run_number }}
          path: |
            data/public_evidence.jsonl
            data/public_sync_state.json
            data/public_sync_status.json
            data/judicial_company_index.json
          retention-days: 30
          compression-level: 6
