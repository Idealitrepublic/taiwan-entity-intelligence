name: Seed T.E.I. test entities

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Seed three smoke entities through Supabase T.E.I.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          base = 'https://rztdbdurkjfrirsrrhtu.supabase.co/functions/v1/tei-web/?api=company&uniform='
          expected = {'23060248': 16, '22099131': 11, '22555003': 10}
          for uid in ['23060248','22099131','22555003']:
              with urllib.request.urlopen(base + uid, timeout=120) as r:
                  data = json.load(r)
              p = data.get('persistence') or {}
              print(uid, json.dumps({'status': data.get('status'), 'company_name': data.get('company_name'), 'people': len(data.get('people', [])), 'edges': len(data.get('graph', {}).get('edges', [])), 'persistence': p, 'evidence_count_after': data.get('local_context', {}).get('evidence_count')}, ensure_ascii=False))
              assert data.get('status') == 'ok', (uid, data)
              assert len(data.get('people', [])) > 0, (uid, 'no people')
              assert len(data.get('graph', {}).get('edges', [])) == len(data.get('people', [])), (uid, 'graph edge mismatch')
              assert p.get('status') == 'ok', (uid, p)
              assert p.get('after_evidence_count') == expected[uid], (uid, p)
          print('seed requests PASS')
          PY

      - name: Verify persistence is idempotent through T.E.I.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          base = 'https://rztdbdurkjfrirsrrhtu.supabase.co/functions/v1/tei-web/?api=company&uniform='
          expected = {'23060248': 16, '22099131': 11, '22555003': 10}
          for uid in ['23060248','22099131','22555003']:
              with urllib.request.urlopen(base + uid, timeout=120) as r:
                  data = json.load(r)
              p = data.get('persistence') or {}
              print(uid, json.dumps({'status': data.get('status'), 'before': p.get('before_evidence_count'), 'after': p.get('after_evidence_count'), 'people_writes': p.get('people_writes'), 'edge_writes': p.get('edge_writes'), 'evidence_writes': p.get('evidence_writes')}, ensure_ascii=False))
              assert data.get('status') == 'ok', (uid, data)
              assert p.get('status') == 'ok', (uid, p)
              assert p.get('before_evidence_count') == expected[uid], (uid, p)
              assert p.get('after_evidence_count') == expected[uid], (uid, p)
              assert p.get('edge_writes') == len(data.get('people', [])), (uid, p)
          print('idempotency verification PASS')
          PY
