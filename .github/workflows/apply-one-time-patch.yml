name: Apply one-time UI and Judicial API patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[one-time-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply patch
        run: python3 scripts/apply_judicial_ui_patch.py

      - name: Compile-check Python
        run: python3 -m py_compile api/index.py scripts/apply_judicial_ui_patch.py

      - name: Commit patched files and remove one-time tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_judicial_ui_patch.py .github/workflows/apply-one-time-patch.yml
          git add web/tei-enhancements.js api/index.py
          git commit -m 'fix: enable judicial API proxy and white graph labels [one-time-patch]'
          git push
