name: T.E.I. release checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tei-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - name: Unit, browser-function and PostgreSQL RLS regressions
        run: npm test
      - name: Verify the actual Python deployment bundle
        run: npm run build
