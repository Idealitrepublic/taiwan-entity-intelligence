name: Entity model checks
on:
  push:
    branches: [feature/entity-model]
  pull_request:
    paths:
      - 'src/entities/**'
      - 'src/relationships/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'app.py'
      - 'scripts/**'
      - 'package*.json'
      - 'requirements-dev.txt'
      - '.github/workflows/entity-model.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
